  product_owner: null  # Who approves the spec (draft → approved)

description: |
  Implement the user's requested reliable controls, reproducible verification,
  minimal resumable state and optional bounded execution. Preserve template
  placeholders, the OpenSpec lifecycle, human approval and manual workflows.

acceptance_criteria:
  - "CLI, hooks and CI share structured YAML validation, coverage classification and documented enforcement settings."
  - "Verification records the command, exit result, code/spec fingerprint and pass/fail/unverified verdict without claiming semantic acceptance."
  - "Persistent state reports the active spec, next step, blocker and last result; changed inputs invalidate evidence."
  - "Optional adapters have explicit opt-in, bounded attempts, time and reserved cost, pause/resume and no automatic approval, commits or cleanup."
  - "Manual commands require no AI runtime; Ruby standard-library requirements and unsupported settings are documented honestly."
  - "Offline regression tests exercise malformed YAML, policy flags, verification, stale state, pauses, bounds and fake adapters."

test_plan:
  - "Run focused Ruby integration tests in isolated Git repositories with no model calls."
  - "Run make test-template, strict OpenSpec validation, shell syntax and workflow YAML checks."
  - "Verify existing placeholders and changes are preserved and docs describe residual limits."

qa_notes: |
  <!-- Manual QA steps, edge cases to verify, or environments to test in.
